<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications | Aditya Medical Store</title><link rel="stylesheet" href="style.css"></head><body><header class="app-header"><div class="brand"><div class="logo">✚</div><div><b>ADITYA</b><small>MEDICAL STORE</small></div></div><a class="secondary" href="index.html">Home</a></header><main class="section"><div class="section-title"><h1>🔔 Notifications</h1><button class="secondary" onclick="markRead()">Mark all read</button></div><div id="list"></div></main><nav class="bottom-nav"><a href="index.html">🏠<span>Home</span></a><a href="orders.html">📋<span>Orders</span></a><a class="active">🔔<span>Alerts</span></a></nav><script src="notifications.js"></script><script>function render(){const n=AdityaNotifications.list();document.getElementById('list').innerHTML=n.length?n.map(x=>`<article class="info" style="opacity:${x.read?.65:1}"><div><b>${esc(x.title)}</b><span>${esc(x.body)}</span><span>${new Date(x.createdAt).toLocaleString()}</span></div></article>`).join(''):'<div class="info"><div><b>No notifications</b><span>Your order updates will appear here.</span></div></div>'}function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function markRead(){AdityaNotifications.markRead();render()}render();</script></body></html>
