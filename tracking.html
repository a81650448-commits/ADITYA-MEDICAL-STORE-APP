<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order | Aditya Medical Store</title><link rel="stylesheet" href="style.css"></head><body><header class="app-header"><div class="brand"><div class="logo">✚</div><div><b>ADITYA</b><small>MEDICAL STORE</small></div></div><a class="secondary" href="index.html">Home</a></header><main class="section"><h1>🚚 Track Your Order</h1><p class="muted">Enter your order ID to see the latest status.</p><div class="search"><input id="orderId" placeholder="Example: AMS-12345678"><button class="primary full" onclick="track()">Track Order</button></div><div id="result"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const db=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function norm(s){return String(s||'').toLowerCase().replace(/[_-]+/g,' ').trim()}function steps(status){const all=['pending','confirmed','packed','out for delivery','delivered'];const s=norm(status);let i=all.indexOf(s);if(i<0){if(s.includes('confirm'))i=1;else if(s.includes('pack'))i=2;else if(s.includes('deliver'))i=s.includes('out')?3:4;else i=0}return all.map((x,n)=>`<div class="track-step ${n<=i?'done':''}"><span>${n<=i?'✓':'○'}</span><b>${x.replace(/\b\w/g,c=>c.toUpperCase())}</b></div>`).join('')}async function track(){const id=document.getElementById('orderId').value.trim();if(!id)return alert('Enter your order ID.');const {data,error}=await db.from('orders').select('order_id,status,total,created_at').eq('order_id',id).maybeSingle();if(error){document.getElementById('result').innerHTML='<p class="error">Unable to check the order right now.</p>';return}if(!data){document.getElementById('result').innerHTML='<div class="info"><b>Order not found</b><span>Check the order ID and try again.</span></div>';return}document.getElementById('result').innerHTML=`<section class="tracking-card"><h2>${esc(data.order_id)}</h2><p>Current status: <b>${esc(data.status)}</b></p><p>Total: <b>₹${Number(data.total||0).toLocaleString('en-IN')}</b></p><p class="muted">Placed: ${new Date(data.created_at).toLocaleString()}</p><div class="tracking">${steps(data.status)}</div></section>`}</script></body></html>
