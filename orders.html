<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Orders | Aditya Medical Store</title><link rel="stylesheet" href="style.css"></head><body><header class="app-header"><div class="brand"><div class="logo">✚</div><div><b>ADITYA</b><small>MEDICAL STORE</small></div></div><a class="secondary" href="index.html">Home</a></header><main class="section"><h1>📋 My Orders</h1><p id="loginNote">Loading your orders...</p><div id="ordersList"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-auth.js"></script><script>async function load(){try{const s=await AdityaAppAuth.session();if(!s){document.getElementById('loginNote').innerHTML='Please log in to view your orders.';return}const orders=await AdityaAppAuth.myOrders();document.getElementById('loginNote').textContent=orders.length?'Your recent orders':'No orders found yet.';document.getElementById('ordersList').innerHTML=orders.map(o=>`<article class="info"><b>${o.order_id}</b><span>Status: ${o.status}</span><span>Total: ₹${o.total}</span><span>Payment: ${o.payment_method}</span><span>${new Date(o.created_at).toLocaleString()}</span></article>`).join('')}</script></body></html>
